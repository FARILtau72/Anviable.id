services:
  web:
    build:
      context: ./findmycompetition
      dockerfile: Dockerfile
    container_name: naviable_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./findmycompetition/.env
    environment:
      - NODE_ENV=production
    networks:
      - naviable_net

  crawler:
    build:
      context: ./crawler_service
      dockerfile: Dockerfile
    container_name: naviable_crawler
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./crawler_service/.env
    networks:
      - naviable_net

networks:
  naviable_net:
    driver: bridge
